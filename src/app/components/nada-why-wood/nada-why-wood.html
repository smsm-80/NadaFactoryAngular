<section class="why-wood">
  <div class="container">
    <div class="content-wrapper">
      <!-- Text Content -->
      <div class="text-content">
        <div class="content-card">
          <h2 class="main-title">{{ getTranslation('nada-why-wood.title') || woodData.title }}</h2>
          
          <div class="features-list">
            <div class="feature-item" *ngFor="let feature of woodData.features; let i = index">
              <div class="feature-icon">{{ feature.icon }}</div>
              <div class="feature-content">
                <h3 class="feature-title">{{ getTranslation('nada-why-wood.features.' + i + '.title') || feature.title }}</h3>
                <p class="feature-subtitle">{{ getTranslation('nada-why-wood.features.' + i + '.subtitle') || feature.subtitle }}</p>
              </div>
            </div>
          </div>
        </div>
      </div>
      
      <!-- Image Content -->
      <div class="image-content">
        <div class="image-container">
    <img src="assets/images/why-nada.jpg" 
      alt="{{ getTranslation('nada-why-wood.imageAlt') || woodData.imageAlt }}" 
      class="main-image">
        </div>
      </div>
    </div>
  </div>
</section>
